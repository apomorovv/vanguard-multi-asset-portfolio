problem:
  source: factor
  n_assets: 2000
  n_groups: 10
  n_factors: 12
  # Keep B, factor covariance, and idiosyncratic variance; construct only the
  # small covariance blocks needed by each window and allocation subproblem.
  materialize_covariance: false
  # Start from a realistic sparse incumbent instead of liquidating a
  # 2,000-name equal-weight portfolio into 50 holdings (195% L1 turnover).
  current_cardinality: 50
  seed: 20260802
  overrides:
    target_return: null
    # L1 turnover: 40% equals 20% under the common one-way convention.
    max_turnover: 0.40

preferences:
  preset: balanced
  lambda_income: 0.5

constraints:
  exact_cardinality: 50
  minimum_active_weight: 0.005
  maximum_weights: 0.04
  mandatory_assets: []

hybrid:
  iterations: 3
  window_size: 16
  held_fraction: 0.45
  allocation_backend: osqp
  allocation_options:
    # Keep the solver residual comfortably below the independent 1e-7
    # feasibility threshold.  At 2,000 assets, eps=1e-7 can leave bound
    # residuals just above that threshold even when OSQP reports "solved".
    tol: 1.0e-10
    max_iter: 500000
  initial_trials: 500
  initial_milp_time_limit: 60
  classical_tabu_iterations: 60
  classical_tabu_tenure: 8
  classical_oracle_candidates: 3
  enumerate_windows_up_to: 5000
  run_quantum: true
  run_penalty_qaoa: false
  use_topology: true
  maximum_quantum_edges: 60
  run_gurobi_reference: true
  gurobi_time_limit: 600
  gurobi_mip_gap: 1.0e-3
  seed: 20260802
  quantum:
    depth: 1
    shots: 4096
    optimizer_maxiter: 50
    optimizer_starts: 2
    seed: 20260802
    initial_state: warm
    mixer: ring
    # Angles use the exact fixed-weight CPU subspace; this selects the final
    # Qiskit circuit sampler and is verified from Aer execution metadata.
    backend: aer_gpu
    maximum_subspace_states: 400000
    top_candidates: 128
    transpile_optimization_level: 3

backtest:
  periods: 120
  periods_per_year: 12
  seed: 20260803

outputs:
  directory: results/large_hybrid
