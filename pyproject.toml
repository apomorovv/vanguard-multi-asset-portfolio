[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vanguard-portfolio"
version = "0.1.0"
description = "Classical and quantum optimization for multi-asset portfolio construction."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Andrei Pomorov", email = "apomorov@usf.edu" },
    { name = "Ilia Fazeli", email="iligili04@icloud.com" },
    { name = "Kirankumar Dhanireddy", email = "kirankumardhanireddy@gmail.com" },
]

dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "PyYAML",
    "cvxpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyterlab",
    "ipykernel",
    "ruff",
]

app = [
    "streamlit",
    "plotly",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
