[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vanguard-multi-asset-portfolio"
version = "1.1.0"
description = "Constraint-safe classical and XY-QAOA hybrid multi-asset portfolio optimization"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [{name = "WISER Vanguard challenge team"}]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
qp = ["osqp>=0.6.3", "cvxpy>=1.4", "clarabel>=0.9"]
mip = ["cvxpy>=1.4", "pyscipopt>=5.0"]
gurobi = ["gurobipy>=11.0"]

# IBM Runtime 0.48 requires Qiskit >=2.3.  Aer 0.17.2 is the newest GPU
# release compatible with that line.  The CUDA-11 wheel runs on newer NVIDIA
# drivers and contains both CPU and GPU simulator implementations, so Linux
# x86_64 needs exactly that one Aer distribution rather than CPU and GPU Aer
# packages installed together.
quantum = ["qiskit==2.5.1", "qiskit-aer==0.17.2"]
quantum-cpu = ["qiskit==2.5.1", "qiskit-aer==0.17.2"]
quantum-gpu = [
  "qiskit==2.5.1",
  "qiskit-aer-gpu-cu11==0.17.2; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "qiskit-aer==0.17.2; platform_system != 'Linux' or platform_machine != 'x86_64'",
]
quantum-gpu-cu11 = [
  "qiskit==2.5.1",
  "qiskit-aer-gpu-cu11==0.17.2; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "qiskit-aer==0.17.2; platform_system != 'Linux' or platform_machine != 'x86_64'",
]

ibm-runtime = ["qiskit==2.5.1", "qiskit-ibm-runtime==0.48.0"]
app = ["streamlit>=1.40", "plotly>=5.24"]
all-solvers = [
  "osqp>=0.6.3",
  "cvxpy>=1.4",
  "clarabel>=0.9",
  "pyscipopt>=5.0",
  "gurobipy>=11.0",
]
test = ["pytest>=8.0", "pytest-cov>=5.0"]
dev = [
  "osqp>=0.6.3",
  "cvxpy>=1.4",
  "clarabel>=0.9",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

# One-environment install.  On Linux x86_64 the GPU-capable Aer distribution
# also provides the CPU simulator.  Other platforms receive portable CPU Aer.
full = [
  "osqp>=0.6.3",
  "cvxpy>=1.4",
  "clarabel>=0.9",
  "pyscipopt>=5.0",
  "gurobipy>=11.0",
  "qiskit==2.5.1",
  "qiskit-aer-gpu-cu11==0.17.2; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "qiskit-aer==0.17.2; platform_system != 'Linux' or platform_machine != 'x86_64'",
  "qiskit-ibm-runtime==0.48.0",
  "pandas>=2.2",
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "streamlit>=1.40",
  "plotly>=5.24",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

# Backward-compatible aliases.  Both now install the same Runtime-compatible
# GPU stack as ``full``; the stale CUDA-12/Qiskit-1.4 combination is removed.
full-gpu = [
  "osqp>=0.6.3",
  "cvxpy>=1.4",
  "clarabel>=0.9",
  "pyscipopt>=5.0",
  "gurobipy>=11.0",
  "qiskit==2.5.1",
  "qiskit-aer-gpu-cu11==0.17.2; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "qiskit-aer==0.17.2; platform_system != 'Linux' or platform_machine != 'x86_64'",
  "qiskit-ibm-runtime==0.48.0",
  "pandas>=2.2",
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "streamlit>=1.40",
  "plotly>=5.24",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

full-gpu-cu11 = [
  "osqp>=0.6.3",
  "cvxpy>=1.4",
  "clarabel>=0.9",
  "pyscipopt>=5.0",
  "gurobipy>=11.0",
  "qiskit==2.5.1",
  "qiskit-aer-gpu-cu11==0.17.2; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "qiskit-aer==0.17.2; platform_system != 'Linux' or platform_machine != 'x86_64'",
  "qiskit-ibm-runtime==0.48.0",
  "pandas>=2.2",
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "streamlit>=1.40",
  "plotly>=5.24",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "optional_solver: requires an optional third-party solver",
  "gurobi: requires gurobipy and a working Gurobi license",
]

[tool.ruff]
line-length = 100
target-version = "py310"
