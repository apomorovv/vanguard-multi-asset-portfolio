[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vanguard-multi-asset-portfolio"
version = "1.0.0"
description = "Constraint-safe classical and XY-QAOA hybrid multi-asset portfolio optimization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "WISER Vanguard challenge team"}]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
qp = ["osqp>=0.6.3", "cvxpy>=1.4", "clarabel>=0.9"]
mip = ["cvxpy>=1.4", "pyscipopt>=5.0"]
gurobi = ["gurobipy>=11.0"]

# ``qiskit-aer`` is CPU-only. Qiskit publishes separate Linux x86_64
# distributions for CUDA 12+ and CUDA 11. Static extras cannot detect hardware,
# so scripts/install_environment.py selects among these extras automatically.
quantum = ["qiskit>=2.0", "qiskit-aer>=0.17"]
quantum-cpu = ["qiskit>=2.0", "qiskit-aer>=0.17"]
quantum-gpu = [
  "qiskit>=2.0",
  "qiskit-aer-gpu>=0.15.1; platform_system == 'Linux' and platform_machine == 'x86_64'",
]
quantum-gpu-cu11 = [
  "qiskit>=2.0",
  "qiskit-aer-gpu-cu11>=0.17; platform_system == 'Linux' and platform_machine == 'x86_64'",
]

ibm-runtime = ["qiskit-ibm-runtime>=0.40"]
app = ["streamlit>=1.40", "plotly>=5.24"]
all-solvers = [
  "osqp>=0.6.3",
  "cvxpy>=1.4",
  "clarabel>=0.9",
  "pyscipopt>=5.0",
  "gurobipy>=11.0",
]
test = ["pytest>=8.0", "pytest-cov>=5.0"]
dev = [
  "osqp>=0.6.3",
  "cvxpy>=1.4",
  "clarabel>=0.9",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

# Backward-compatible portable full install. It intentionally remains CPU-only;
# use scripts/install_environment.py for automatic CPU/GPU selection.
full = [
  "osqp>=0.6.3",
  "cvxpy>=1.4",
  "clarabel>=0.9",
  "pyscipopt>=5.0",
  "gurobipy>=11.0",
  "qiskit>=2.0",
  "qiskit-aer>=0.17",
  "qiskit-ibm-runtime>=0.40",
  "streamlit>=1.40",
  "plotly>=5.24",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
full-gpu = [
  "osqp>=0.6.3",
  "cvxpy>=1.4",
  "clarabel>=0.9",
  "pyscipopt>=5.0",
  "gurobipy>=11.0",
  "qiskit>=2.0",
  "qiskit-aer-gpu>=0.15.1; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "qiskit-ibm-runtime>=0.40",
  "streamlit>=1.40",
  "plotly>=5.24",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
full-gpu-cu11 = [
  "osqp>=0.6.3",
  "cvxpy>=1.4",
  "clarabel>=0.9",
  "pyscipopt>=5.0",
  "gurobipy>=11.0",
  "qiskit>=2.0",
  "qiskit-aer-gpu-cu11>=0.17; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "qiskit-ibm-runtime>=0.40",
  "streamlit>=1.40",
  "plotly>=5.24",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "optional_solver: requires an optional third-party solver",
  "gurobi: requires gurobipy and a working Gurobi license",
]

[tool.ruff]
line-length = 100
target-version = "py310"
