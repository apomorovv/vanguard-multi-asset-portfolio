[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vanguard-multi-asset-portfolio"
version = "0.3.0"
description = "Auditable classical and quantum-ready baselines for multi-asset portfolio construction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "WISER Vanguard challenge team"}]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
qp = ["osqp>=0.6.3", "cvxpy>=1.4", "clarabel>=0.9"]
mip = ["cvxpy>=1.4", "pyscipopt>=5.0"]
gurobi = ["gurobipy>=11.0"]
all-solvers = [
  "osqp>=0.6.3",
  "cvxpy>=1.4",
  "clarabel>=0.9",
  "pyscipopt>=5.0",
  "gurobipy>=11.0",
]
test = ["pytest>=8.0", "pytest-cov>=5.0"]
dev = [
  "osqp>=0.6.3",
  "cvxpy>=1.4",
  "clarabel>=0.9",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "optional_solver: requires an optional third-party solver",
  "gurobi: requires gurobipy and a working Gurobi license",
]

[tool.ruff]
line-length = 100
target-version = "py310"
